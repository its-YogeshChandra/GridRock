#compose file for the storage node + shard controller

services:
  storagenode1:
    build:
      context: ./storagenode
      dockerfile: dockerfile
    container_name: storagenode1
    volumes:
      - storagenode1_data:/app/gridrock_data
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      - NODE_ID=1
      - NODE_PORT=50051
      - NODE_PEERS=1:storagenode1:50051,2:storagenode2:50052,3:storagenode3:50053

  storagenode2:
    build:
      context: ./storagenode
      dockerfile: dockerfile
    container_name: storagenode2
    volumes:
      - storagenode2_data:/app/gridrock_data
    ports:
      - "127.0.0.1:50052:50052"
    environment:
      - NODE_ID=2
      - NODE_PORT=50052
      - NODE_PEERS=1:storagenode1:50051,2:storagenode2:50052,3:storagenode3:50053

  storagenode3:
    build:
      context: ./storagenode
      dockerfile: dockerfile
    container_name: storagenode3
    volumes:
      - storagenode3_data:/app/gridrock_data
    ports:
      - "127.0.0.1:50053:50053"
    environment:
      - NODE_ID=3
      - NODE_PORT=50053
      - NODE_PEERS=1:storagenode1:50051,2:storagenode2:50052,3:storagenode3:50053

  #config server : builds the consistent hash ring from the storage node
  #addresses below (Server0Address, Server1Address, ... one per node)
  shardcontroller:
    build:
      context: ./shardcontroller
      dockerfile: dockerfile
    container_name: shardcontroller
    ports:
      - "127.0.0.1:50060:50060"
    environment:
      - Server0Address=storagenode1:50051
      - Server1Address=storagenode2:50052
      - Server2Address=storagenode3:50053

volumes:
  storagenode1_data:
  storagenode2_data:
  storagenode3_data:


  
