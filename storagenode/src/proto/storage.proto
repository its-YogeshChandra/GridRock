syntax = "proto3";
package storage_system;

message CreateRequest{
    string unique_id = 1;
    uint64 balance = 2;
    bool executable = 3;
    uint64 rent_epoch = 4;
    string data_hash = 5;
    uint64 last_updated_slot = 6;
}


message PutRequest {
    string unique_id =1;
    bytes values = 2;
}


message GetValRequest{
    string unique_id = 1;
}

message DelValRequest {
   string unique_id =1; 
}

message StorageResponse{
    string message = 1;
    bool success = 2;

    optional string key = 3;
    optional bytes data = 8;
}    

// Wrapper message for Raft log entries.
// Every proposal sent through node.propose() gets serialized as this.
// Any node (leader or follower) can decode entry.data as RaftProposal
// and know both the operation type and the full payload.
message RaftProposal {
    uint64 proposal_id = 1;

    oneof operation {
        PutRequest create = 2;
        PutRequest update = 3;
        GetValRequest get = 4;
        DelValRequest delete = 5;
    }
}



service GridRock {
    rpc CreateValinStorage (PutRequest) returns (StorageResponse);
    rpc UpdateValinStorage (PutRequest) returns (StorageResponse);
    rpc GetValfromStorage (GetValRequest) returns (StorageResponse);
    rpc DelValfromStorage(DelValRequest)returns (StorageResponse);
}
