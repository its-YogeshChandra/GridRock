syntax = "proto3";
package node_comm;

// ── 1. Raft Transport ──────────────────────────────────────────
// Wraps the serialized eraftpb::Message bytes.
// Used for all Raft protocol messages (AppendEntries, Vote, Heartbeat, Snapshot, etc.)
message RaftMessageRequest {
    bytes message = 1;
}

// ── 2. Request Forwarding ──────────────────────────────────────
// When a follower receives a client write, it forwards the proposal to the leader.
// The proposal_data field carries a serialized storage_system.RaftProposal.
message ForwardProposalRequest {
    bytes proposal_data = 1;       // serialized RaftProposal from storage.proto
    uint64 sender_node_id = 2;     // node that is forwarding the request
}

message ForwardProposalResponse {
    bool success = 1;
    string message = 2;
}

// ── 3. Cluster Management ──────────────────────────────────────
// A new node sends this to an existing node to join the cluster.
message JoinClusterRequest {
    uint64 node_id = 1;
    string address = 2;  // e.g. "192.168.1.5:50051"
}

message JoinClusterResponse {
    bool success = 1;
    string message = 2;
    repeated PeerInfo peers = 3;  // current cluster membership returned to the joiner
}

// Used inside JoinClusterResponse and GetClusterInfoResponse.
message PeerInfo {
    uint64 node_id = 1;
    string address = 2;
}

// Any node can request the current cluster membership.
message GetClusterInfoRequest {}

message GetClusterInfoResponse {
    uint64 leader_id = 1;
    repeated PeerInfo peers = 2;
}

// ── Generic acknowledgement for RPCs that only need success/fail ──
message RaftMessageResponse {
    bool success = 1;
}

// ── Service ────────────────────────────────────────────────────
service NodeComm {
    // Raft transport: carries all Raft protocol messages between nodes
    rpc SendRaftMessage (RaftMessageRequest) returns (RaftMessageResponse);

    // Follower → Leader: forward a client write request
    rpc ForwardProposal (ForwardProposalRequest) returns (ForwardProposalResponse);

    // New node → existing node: request to join the cluster
    rpc JoinCluster (JoinClusterRequest) returns (JoinClusterResponse);

    // Any node → any node: query current cluster membership
    rpc GetClusterInfo (GetClusterInfoRequest) returns (GetClusterInfoResponse);
}