syntax = "proto3";
package storage_system;

message CreateRequest{
    string unique_id = 1;
    uint64 balance = 2;
    bool executable = 3;
    uint64 rent_epoch = 4;
    string data_hash = 5;
    uint64 last_updated_slot = 6;
}
message UpdateRequest {
    string unique_id = 1;
    uint64 balance = 2;
}

message GetValRequest{
    string unique_id = 1;
}

message DelValRequest {
   string unique_id =1; 
}

message StorageResponse{
    string message = 1;
    bool success = 2;

    // Data fields — populated only for Get responses
    optional string unique_id = 3;
    optional uint64 balance = 4;
    optional bool executable = 5;
    optional uint64 rent_epoch = 6;
    optional string data_hash = 7;
    optional uint64 last_updated_slot = 8;
}    

// Wrapper message for Raft log entries.
// Every proposal sent through node.propose() gets serialized as this.
// Any node (leader or follower) can decode entry.data as RaftProposal
// and know both the operation type and the full payload.
message RaftProposal {
    uint64 proposal_id = 1;

    oneof operation {
        CreateRequest create = 2;
        UpdateRequest update = 3;
        GetValRequest get = 4;
        DelValRequest delete = 5;
    }
}



service GridRock {
    rpc CreateValinStorage (CreateRequest) returns (StorageResponse);
    rpc UpdateValinStorage (UpdateRequest) returns (StorageResponse);
    rpc GetValfromStorage (GetValRequest) returns (StorageResponse);
    rpc DelValfromStorage(DelValRequest)returns (StorageResponse);
}
