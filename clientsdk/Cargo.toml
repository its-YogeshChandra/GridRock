[package]
name = "clientsdk"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.53.1", features = ["full"]}
tonic = { version = "0.14.6", features = ["default"] }
prost = "0.14"
tonic-prost = "0.14.6"
protobuf = "2.28"
rand = "0.10.2"
serde = {version ="1.0.229", features = ["derive"]}

[build-dependencies]
tonic-prost-build = "0.14.6"

[[bin]]
name = "client-sdk"
path = "src/client.rs"
